name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy by hand from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue them instead of cancelling, so a
# candidate's answers can't be dropped by a later push starting mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # These action majors run on the Node 24 runtime. GitHub removes Node 20
      # from the runners on 2026-09-16, so older majors (checkout@v4,
      # setup-node@v4, deploy-pages@v4) fail outright. This is the runtime the
      # actions themselves execute in — unrelated to node-version below.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The Node that builds the site. Matches local development.
          node-version: 24
          cache: npm

      - run: npm ci

      # Type-checks and lints before building: a bad candidates.json entry
      # fails here rather than shipping a blank page to members.
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
